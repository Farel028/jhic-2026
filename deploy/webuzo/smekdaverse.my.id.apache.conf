# Install this as:
# /var/webuzo-data/apache2/custom/domains/smekdaverse.my.id.conf
#
# Webuzo's Nginx reverse proxy receives the public request first, then Apache
# forwards it to the Next.js process bound to localhost.

ProxyPreserveHost On
ProxyPass / http://127.0.0.1:3000/
ProxyPassReverse / http://127.0.0.1:3000/
ProxyTimeout 60

RequestHeader set X-Forwarded-Proto "https"
RequestHeader set X-Forwarded-Host "smekdaverse.my.id"
